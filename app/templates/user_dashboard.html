{% extends "base.html" %}
{% block title %}My submissions - queue3d{% endblock %}
{% block nav %}
  <form method="post" action="/logout"><button type="submit">Log out</button></form>
{% endblock %}
{% block content %}
  <h2>Hi, {{ user.name }}</h2>

  <form id="upload-form" method="post" action="/upload" enctype="multipart/form-data">
    <label>Upload a model (.stl)<br><input type="file" id="stl-file" name="file" accept=".stl" required></label>
    <label><input type="checkbox" name="enable_supports"> Generate supports</label>
    <label>Support style<br>
      <select name="support_style">
        {% for value, label in support_styles.items() %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Upload &amp; slice</button>
    <progress id="upload-progress" value="0" max="100" hidden></progress>
  </form>

  <div id="preview-container" class="preview-container" hidden></div>
  <p id="preview-info" class="preview-info"></p>

  {% if flash_error %}<p class="error">{{ flash_error }}</p>{% endif %}

  <script type="importmap">
    { "imports": { "three": "/static/vendor/three/three.module.min.js" } }
  </script>
  <script type="module">
    import { previewFile } from "/static/preview.js";

    const fileInput = document.getElementById("stl-file");
    const container = document.getElementById("preview-container");
    const info = document.getElementById("preview-info");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      container.hidden = false;
      previewFile(file, container, info);
    });
  </script>
  <script>
    // A plain <form method=post> already works with no JS at all (a
    // normal post-redirect-get to /dashboard) - this only adds a progress
    // bar for the "receiving" half of the to-do item (the other half,
    // "slicing", is handled by _jobs_table.html's htmx polling once we're
    // back on /dashboard). Sent manually via XHR rather than through htmx
    // because what's needed here is genuine upload-byte progress
    // (xhr.upload's own progress event), not an htmx-managed
    // request/swap - and the server always ends at the same place
    // (/dashboard, error or not - see routers/user.py's upload()), so the
    // completion handler doesn't need to inspect the response at all,
    // just navigate there for real.
    const uploadForm = document.getElementById("upload-form");
    const uploadProgress = document.getElementById("upload-progress");
    uploadForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const xhr = new XMLHttpRequest();
      xhr.open("POST", uploadForm.action);
      xhr.upload.addEventListener("progress", (e) => {
        if (!e.lengthComputable) return;
        uploadProgress.hidden = false;
        uploadProgress.value = e.loaded;
        uploadProgress.max = e.total;
      });
      xhr.addEventListener("loadend", () => {
        window.location.href = "/dashboard";
      });
      xhr.send(new FormData(uploadForm));
    });
  </script>

  {% include "_jobs_table.html" %}
{% endblock %}
