<!doctype html>
<html lang="en" data-theme="{{ current_theme(request) }}" data-mode="{{ current_mode(request) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}queue3d{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/countdown.js"></script>
  <style>
    /* Theme tokens - see app/themes.py for the selectable set and
       app/README.md's "Themes" section for how a viewer's two separate
       stored choices (User.theme/theme_mode, Admin.theme/theme_mode)
       become the data-theme/data-mode attributes above. This :root block
       *is* "Basic" (id "default" - renamed from "Default" once it
       stopped being the only theme) in "Light" mode - every other
       theme/mode combination adds a [data-theme="<id>"] and/or
       [data-theme="<id>"][data-mode="dark"] block below overriding just
       the tokens it wants different, not a full copy of every rule in
       this file. Mode is a separate axis from theme, not folded into it
       - per the user, every theme gets both a light and a dark variant.
       Note that "Basic" being id "default" is no longer the same thing
       as being *the* default theme - see themes.py's DEFAULT_THEME vs.
       LOGGED_OUT_THEME for how those diverged once BMMS became this
       deployment's actual default for signed-in accounts.

       Hardcoded colors, not the CSS Color 4 system keywords Canvas/
       CanvasText an earlier version of this used: those tracked the OS's
       own light/dark preference automatically, which is exactly what an
       explicit, saved-per-account mode toggle needs to override instead
       of defer to - a viewer who explicitly picks "Light" should get
       light even if their OS is set to dark, which Canvas/CanvasText
       can't do. color-scheme is set to match each mode explicitly too
       (not "light dark"), so native form controls (checkboxes, date
       pickers, scrollbars) follow the chosen mode as well, not the OS. */
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #1a1a1a;
      --error: #c0392b;
      --border: #8883;
      --border-strong: #8886;
      --detail-bg: #8881;
      /* A fixed categorical palette for the System dashboard's charts
         (admin_system.html) - one color per CPU core line, reused for
         memory/swap and network's two lines each. Deliberately the same
         8 hues in every theme rather than theme-tinted: these identify
         *which series is which* on one chart (core 0 vs core 1, received
         vs sent), a job no theme's own accent-color system is built for,
         and a viewer comparing this dashboard against itself over time
         benefits more from "core 2 is always orange" than from it
         shifting with whatever theme happens to be active. Picked for
         readability against both a white and near-black background
         without retuning per mode - saturated enough to stay visible on
         either, none of them fighting `--error`'s own red. */
      --chart-1: #3b82f6;
      --chart-2: #f97316;
      --chart-3: #22c55e;
      --chart-4: #ef4444;
      --chart-5: #a855f7;
      --chart-6: #14b8a6;
      --chart-7: #ec4899;
      --chart-8: #78716c;
    }
    :root[data-mode="dark"] {
      color-scheme: dark;
      --bg: #1a1a1a;
      --text: #e8e8e8;
      --error: #ff6b6b;
    }

    /* Console theme (see themes.py) - its own layout tokens on top of
       the shared --bg/--text/--error/--border* ones above, since this is
       the first theme that needs more than a color swap: a distinct
       sidebar background, a distinct content-area background, and a
       section-title accent color strong enough to read as a real
       "titlebar" against either. Both modes defined here, right next to
       each other, same as every other theme's pair - light first (this
       block), dark immediately below overriding just what changes. */
    [data-theme="console"] {
      color-scheme: light;
      --bg: #eef0f4;
      --text: #1a1a1a;
      --error: #c0392b;
      --border: #d0d4dc;
      --border-strong: #b7bdc9;
      --detail-bg: #8881;
      --sidebar-bg: #e4e7ee;
      --content-bg: #ffffff;
      /* Same indigo as the dark palette below, not a separate, darker
         navy - per the user, after the original #2b3a67 read as barely
         distinguishable from black/gray on a light background. A color
         this saturated needs the same value in both modes to actually
         look "blue" against either background; a duller shade chosen to
         feel more "light mode-appropriate" just came across as no color
         at all. */
      --section-title-bg: #3b5bdb;
      --section-title-text: #f4f6fb;
    }
    [data-theme="console"][data-mode="dark"] {
      color-scheme: dark;
      --bg: #14171c;
      --text: #e8e8e8;
      --error: #ff6b6b;
      --border: #333a47;
      --border-strong: #454e5e;
      --sidebar-bg: #191d24;
      --content-bg: #1c2029;
      --section-title-bg: #3b5bdb;
      --section-title-text: #f4f6fb;
    }

    /* Savanna theme (see themes.py) - the same sidebar/full-width/
       bordered-section layout as Console (shared structural rules below,
       keyed off both [data-theme="console"] and [data-theme="savanna"]
       at once) with a warm desert-sunrise palette and a background photo
       behind the sidebar instead of a flat color - per the user. Warm
       browns/creams and a burnt-amber section-title accent instead of
       Console's cool grays/indigo; --sidebar-bg here is only the
       *fallback* color (shown briefly before the image loads, or if it
       fails to), the real look comes from the header's own
       background-image rule further down. */
    [data-theme="savanna"] {
      color-scheme: light;
      --bg: #fbf3e7;
      --text: #2e2013;
      --error: #c0392b;
      --border: #e6d7bd;
      --border-strong: #d3bf9c;
      --detail-bg: #8881;
      --sidebar-bg: #2b1a12;
      --content-bg: #fffaf2;
      /* Same amber as the dark palette below, for the same reason
         Console's two section-title-bg values match each other - a
         color this saturated needs to stay consistent to read as an
         actual accent color in both modes, not a washed-out variant of
         itself in one of them. */
      --section-title-bg: #c9622a;
      --section-title-text: #fdf6ec;
    }
    [data-theme="savanna"][data-mode="dark"] {
      color-scheme: dark;
      --bg: #1c140f;
      --text: #ecdfcd;
      --error: #ff6b6b;
      --border: #3d2e21;
      --border-strong: #52402f;
      --sidebar-bg: #150d09;
      --content-bg: #241a13;
      --section-title-bg: #c9622a;
      --section-title-text: #fdf6ec;
    }

    /* Fil theme (see themes.py) - same shared sidebar/full-width/
       bordered-section layout again, this time with a plain, bright
       minty palette instead of a photo, since the actual personality
       here comes from the mascot images further down rather than the
       background. --section-title-bg reuses Fil's own body color
       (#12b5a6, see theme-fil-*.svg) so the section titles read as "his"
       color in both modes, same reasoning as Console/Savanna's own
       section-title-bg choice above. */
    [data-theme="fil"] {
      color-scheme: light;
      --bg: #f5fbfa;
      --text: #123330;
      --error: #c0392b;
      --border: #cdeae5;
      --border-strong: #a9dcd4;
      --detail-bg: #8881;
      --sidebar-bg: #e3f6f3;
      --content-bg: #ffffff;
      --section-title-bg: #12b5a6;
      --section-title-text: #f4fffd;
    }
    [data-theme="fil"][data-mode="dark"] {
      color-scheme: dark;
      --bg: #101a19;
      --text: #dff5f2;
      --error: #ff6b6b;
      --border: #1e3532;
      --border-strong: #2c4b47;
      --sidebar-bg: #0b1414;
      --content-bg: #16211f;
      --section-title-bg: #12b5a6;
      --section-title-text: #f4fffd;
    }

    /* BMMS theme (see themes.py) - Black Mountain Middle School's own
       maroon-and-gold colors, per the user, not a generic palette
       invented for this app. --sidebar-bg is a fixed maroon in both
       modes rather than flipping light/dark like Console's own sidebar
       does - school colors are a fixed identity, not something that
       should look "washed out" in light mode - the same reasoning
       Savanna's photo-sidebar already established, just with a flat
       color here instead of an image. --section-title-bg/text (a
       brighter maroon with gold text) stays fixed across modes too, for
       the same "a saturated accent needs to stay saturated in both
       palettes" reason as every other theme's own section-title color. */
    [data-theme="bmms"] {
      color-scheme: light;
      --bg: #faf5ea;
      --text: #2a1013;
      --error: #c0392b;
      --border: #e8d9b0;
      --border-strong: #d4bc7a;
      --detail-bg: #8881;
      --sidebar-bg: #4a0d15;
      --content-bg: #fffdf7;
      --section-title-bg: #7a1420;
      --section-title-text: #f0c975;
    }
    [data-theme="bmms"][data-mode="dark"] {
      color-scheme: dark;
      --bg: #140f0c;
      --text: #f3e9da;
      --error: #ff6b6b;
      --border: #3a2a1c;
      --border-strong: #55402a;
      --sidebar-bg: #4a0d15;
      --content-bg: #1c1613;
      --section-title-bg: #7a1420;
      --section-title-text: #f0c975;
    }

    /* Halloween theme (see themes.py) - same shared sidebar/full-width/
       bordered-section layout again, seasonal rather than year-round
       (themes.SEASONAL_THEMES). --sidebar-bg is a fixed deep purple in
       both modes, same reasoning as BMMS's own fixed maroon: the
       sidebar's real look comes from theme-halloween-manor.svg's own
       night scene further down, which already looks the same regardless
       of mode, so there's nothing to "flip" the way Console's flat
       sidebar color does. --section-title-bg is a pumpkin orange,
       matching the jack-o'-lanterns in that same scene, with a dark
       "carved-pumpkin" brown for its text - both fixed across modes,
       same "a saturated accent needs to stay saturated" reasoning as
       every other theme's own section-title color. */
    [data-theme="halloween"] {
      color-scheme: light;
      --bg: #f6f2fb;
      --text: #241a3a;
      --error: #c0392b;
      --border: #ded4f0;
      --border-strong: #c7b8e8;
      --detail-bg: #8881;
      --sidebar-bg: #201735;
      --content-bg: #fdfaff;
      --section-title-bg: #e8720c;
      --section-title-text: #2a1400;
    }
    [data-theme="halloween"][data-mode="dark"] {
      color-scheme: dark;
      --bg: #120b1f;
      --text: #ece5f7;
      --error: #ff6b6b;
      --border: #2c2147;
      --border-strong: #40315f;
      --sidebar-bg: #201735;
      --content-bg: #1c1530;
      --section-title-bg: #e8720c;
      --section-title-text: #2a1400;
    }

    /* Thanksgiving theme (see themes.py) - same shared sidebar/
       full-width/bordered-section layout, seasonal like Halloween.
       --sidebar-bg is a fixed warm brown in both modes, same "fixed
       identity, the real look comes from the background image" reasoning
       as Halloween's own sidebar-bg. --section-title-bg is a burnt
       sienna, matching the barn scene's own accent color
       (theme-thanksgiving-harvest.svg) and the turkey mascot's own body
       color, with a warm cream for its text - both fixed across modes,
       same "a saturated accent needs to stay saturated" reasoning as
       every other theme's own section-title color. */
    [data-theme="thanksgiving"] {
      color-scheme: light;
      --bg: #fdf6ec;
      --text: #3a2314;
      --error: #c0392b;
      --border: #ecdcc0;
      --border-strong: #d9c096;
      --detail-bg: #8881;
      --sidebar-bg: #4a2416;
      --content-bg: #fffaf0;
      --section-title-bg: #b5541f;
      --section-title-text: #fff3d6;
    }
    [data-theme="thanksgiving"][data-mode="dark"] {
      color-scheme: dark;
      --bg: #17100a;
      --text: #f3e6d3;
      --error: #ff6b6b;
      --border: #3a2a1c;
      --border-strong: #55402a;
      --sidebar-bg: #4a2416;
      --content-bg: #211711;
      --section-title-bg: #b5541f;
      --section-title-text: #fff3d6;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2rem; }
    header a { text-decoration: none; }
    h1 { font-size: 1.25rem; }
    form { display: grid; gap: 0.75rem; max-width: 320px; }
    label { font-size: 0.9rem; opacity: 0.8; }
    input { font-size: 1rem; padding: 0.5rem; }
    button { font-size: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    .error { color: var(--error); }
    .muted { opacity: 0.7; font-size: 0.9rem; }
    /* The school logo and its surrounding centered layout on the two
       login pages (admin_login.html, user_login.html) - a plain rule,
       not theme-gated like .bmms-logo above, since it's meant to show
       up there regardless of theme (see those templates' own comments
       for why). Per the user, after the first version (a small
       left-aligned logo above an otherwise left-aligned page): a large,
       centered logo above a centered form. .login-page centers
       everything (the logo, "Log in" heading, error/muted text) via
       text-align, then the form - a block with its own fixed max-width,
       so text-align alone can't center it - gets margin: 0 auto to
       center as a block instead, with text-align reset to left inside
       it since centering the labels/inputs themselves would look odd.
       The logo's own width is 480px - 50% wider than the form's own
       320px (the generic `form` rule's max-width above), like a
       letterhead spanning wider than the form it sits above - per the
       user, not an arbitrary "large" size. */
    .login-logo { display: block; width: 480px; max-width: 90%; height: auto; margin: 0 auto 1.5rem; }
    .login-page { text-align: center; }
    .login-page form { margin: 0 auto; text-align: left; }
    /* The signup page's Acceptable Use Agreement (user_signup.html) -
       left-aligned like the form (a bulleted policy list centered via
       text-align would be unreadable), but sized to the same 480px the
       logo above already uses rather than the form's own narrower
       320px, since a list of full sentences needs more width than a
       single-field-per-row credential form to read comfortably. */
    .aup { text-align: left; max-width: 480px; margin: 0 auto 1.25rem; }
    .aup ul { padding-left: 1.25rem; margin: 0.5rem 0; }
    .aup li { margin-bottom: 0.4rem; }
    /* A one-time success/informational message (e.g. a freshly-reset PIN,
       shown exactly once) - built from the same neutral tokens as
       details.tech-detail's box below rather than a new semantic color,
       since this is the only other place that needs any highlight at
       all beyond plain text or .error. */
    .notice { background: var(--detail-bg); border: 1px solid var(--border-strong); border-radius: 4px; padding: 0.5rem 0.75rem; }
    /* Overrides the generic `form` rule above (a narrow, one-field-per-row
       grid, right for a login/settings form) for the GET-based filter bar
       above every job/log/user table (see _job_filters.html/
       _log_filters.html/_user_filters.html) - several short fields meant
       to sit in one horizontal row above a wide table, not stack
       vertically in a 320px column. flex-wrap so a narrow viewport wraps
       fields onto more than one line instead of overflowing. */
    form.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; max-width: none; margin-bottom: 1rem; }
    form.filters input, form.filters select { font-size: 0.9rem; padding: 0.3rem 0.4rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
    .preview-container { width: 100%; max-width: 500px; height: 350px; border: 1px solid var(--border-strong); touch-action: none; }
    .preview-info { font-size: 0.85rem; opacity: 0.8; margin-top: 0.25rem; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; opacity: 0.6; }
    progress { vertical-align: middle; margin-left: 0.5rem; }
    /* A collapsed-by-default technical detail (e.g. raw slicer output on
       a failure) - a native <details>/<summary> disclosure, not JS, so a
       user-friendly one-line summary is what shows by default and the
       full text (which can be thousands of characters - see Job.slice_error)
       only takes over the page if actually opened. */
    details.tech-detail { margin: 0.5rem 0; }
    details.tech-detail summary { cursor: pointer; font-size: 0.85rem; opacity: 0.8; }
    details.tech-detail pre {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 16rem;
      overflow-y: auto;
      font-size: 0.8rem;
      background: var(--detail-bg);
      padding: 0.5rem;
      border-radius: 4px;
    }

    /* System dashboard (admin_system.html, _system_metrics.html) - an
       htop-style "top" section (per-core bars, memory/swap, load/uptime/
       task counts) above a set of Fedora-system-monitor-style history
       charts (plain SVG, no charting library - see
       sysmetrics.svg_polyline_points). */
    .sys-top { display: flex; flex-wrap: wrap; gap: 1.5rem 2.5rem; margin-bottom: 1.25rem; }
    .sys-cores {
      flex: 2 1 320px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.35rem 1.25rem;
      align-content: start;
    }
    .sys-stats { flex: 1 1 200px; font-size: 0.9rem; }
    .sys-stats dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 0.2rem 0.75rem; }
    .sys-stats dt { opacity: 0.7; }
    .sys-stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .sys-mem { display: grid; gap: 0.35rem; max-width: 420px; margin-bottom: 1.25rem; }
    /* One labeled bar - a CPU core, memory, swap, or a disk. Color
       thresholds (via .warn/.crit, applied server-side from the same
       number already shown as text) borrow the same semantic colors as
       every other status text in this app rather than inventing new
       ones - amber/red both already mean "needs attention" elsewhere. */
    .sysbar { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .sysbar-label { flex: 0 0 auto; min-width: 2.5rem; opacity: 0.7; }
    .sysbar-track {
      flex: 1 1 auto;
      height: 0.85rem;
      background: var(--detail-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    /* display: block - a <span> is inline by default, which makes a
       browser silently ignore width/height on it entirely (only this
       element's own text content would size it) - the actual bug an
       earlier look at this page caught, not a hypothetical, since every
       bar rendered as an empty track with no fill at all regardless of
       the real percentage. */
    .sysbar-fill { display: block; height: 100%; background: #22c55e; transition: width 1.8s linear; }
    .sysbar-fill.warn { background: #d97706; }
    .sysbar-fill.crit { background: var(--error); }
    .sysbar-pct { flex: 0 0 3.2rem; text-align: right; opacity: 0.85; }
    .syscharts { display: grid; gap: 1.25rem; }
    .syschart h4 { margin: 0 0 0.25rem; font-size: 0.85rem; font-weight: 600; opacity: 0.85; }
    .syschart-scale { font-weight: 400; opacity: 0.7; }
    .syschart-svg {
      width: 100%;
      height: 110px;
      display: block;
      background: var(--detail-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .syschart-svg polyline { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
    .syschart-legend { font-size: 0.75rem; opacity: 0.75; margin-top: 0.3rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .syschart-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
    .syschart-legend span::before {
      content: "";
      display: inline-block;
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: currentColor;
    }

    /* Console theme layout - see the token block above for its colors.
       Everything below is structural, not color, which is why it's kept
       separate: this is the actual "sidebar tabs, bordered sections,
       full browser width" ask, all achievable in CSS alone against the
       exact same markup every other theme uses (the sidebar is just
       <header> restyled from a horizontal top bar into a vertical
       column; <main> - added specifically so this theme has a second
       flex sibling to size against - already sits next to it either
       way) except for one thing: grouping a <h3> with the content that
       follows it, up to the next <h3>, into one bordered box. CSS has no
       "these siblings, up to a stopping point" selector, so that part is
       the small inline script at the bottom of this file instead -
       gated to only run under this theme, touching no template. */
    /* Shared by every sidebar-layout theme (Console, Savanna, and any
       future one) - kept as one set of structural rules, keyed off
       multiple [data-theme] selectors at once, rather than duplicating
       the same layout per theme; only the color tokens and (for Savanna)
       the header's own background-image differ per theme from here on. */
    [data-theme="console"] body,
    [data-theme="savanna"] body,
    [data-theme="fil"] body,
    [data-theme="bmms"] body,
    [data-theme="halloween"] body,
    [data-theme="thanksgiving"] body {
      max-width: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: stretch;
      min-height: 100vh;
    }
    [data-theme="console"] header,
    [data-theme="savanna"] header,
    [data-theme="fil"] header,
    [data-theme="bmms"] header,
    [data-theme="halloween"] header,
    [data-theme="thanksgiving"] header {
      flex: 0 0 220px;
      box-sizing: border-box;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 0.25rem;
      margin-bottom: 0;
      padding: 1.5rem 1rem;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-strong);
      position: sticky;
      top: 0;
      align-self: flex-start;
      height: 100vh;
      overflow-y: auto;
    }
    [data-theme="console"] header h1,
    [data-theme="savanna"] header h1,
    [data-theme="fil"] header h1,
    [data-theme="bmms"] header h1,
    [data-theme="halloween"] header h1,
    [data-theme="thanksgiving"] header h1 {
      margin: 0 0 1rem 0.25rem;
    }
    /* Every page's own nav block is a flat list of <a> tags (plus one
       <form> for Log out) - turned into a vertical stack of tab-like
       rows here, purely by restyling that same markup, not by changing
       it. */
    [data-theme="console"] header a,
    [data-theme="console"] header form,
    [data-theme="savanna"] header a,
    [data-theme="savanna"] header form,
    [data-theme="fil"] header a,
    [data-theme="fil"] header form,
    [data-theme="bmms"] header a,
    [data-theme="bmms"] header form,
    [data-theme="halloween"] header a,
    [data-theme="halloween"] header form,
    [data-theme="thanksgiving"] header a,
    [data-theme="thanksgiving"] header form {
      display: block;
    }
    [data-theme="console"] header a,
    [data-theme="savanna"] header a,
    [data-theme="fil"] header a,
    [data-theme="bmms"] header a,
    [data-theme="halloween"] header a,
    [data-theme="thanksgiving"] header a {
      padding: 0.6rem 0.75rem;
      border-radius: 4px;
      color: var(--text);
    }
    [data-theme="console"] header a:hover,
    [data-theme="savanna"] header a:hover,
    [data-theme="fil"] header a:hover,
    [data-theme="bmms"] header a:hover,
    [data-theme="halloween"] header a:hover,
    [data-theme="thanksgiving"] header a:hover {
      background: var(--border);
    }
    [data-theme="console"] header form,
    [data-theme="savanna"] header form,
    [data-theme="fil"] header form,
    [data-theme="bmms"] header form,
    [data-theme="halloween"] header form,
    [data-theme="thanksgiving"] header form {
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    [data-theme="console"] header form button,
    [data-theme="savanna"] header form button,
    [data-theme="fil"] header form button,
    [data-theme="bmms"] header form button,
    [data-theme="halloween"] header form button,
    [data-theme="thanksgiving"] header form button {
      width: 100%;
    }
    [data-theme="console"] main,
    [data-theme="savanna"] main,
    [data-theme="fil"] main,
    [data-theme="bmms"] main,
    [data-theme="halloween"] main,
    [data-theme="thanksgiving"] main {
      flex: 1 1 auto;
      min-width: 0;
      padding: 2rem 2.5rem;
      background: var(--content-bg);
    }
    /* The section-box look itself - .theme-section is added by the
       inline script below, wrapping a <h3> and everything after it up to
       the next one (or the end of the page). The title bar is the <h3>
       itself, styled to fill the section's full width in a contrasting
       color, per the user ("a contrasting color for section titles to
       make them stand out more") - not just a colored underline. Named
       generically (not "console-section") since Savanna reuses the exact
       same class/script now too - the only thing that changes per theme
       is what --section-title-bg/--section-title-text/--border-strong
       actually resolve to. */
    [data-theme="console"] .theme-section,
    [data-theme="savanna"] .theme-section,
    [data-theme="fil"] .theme-section,
    [data-theme="bmms"] .theme-section,
    [data-theme="halloween"] .theme-section,
    [data-theme="thanksgiving"] .theme-section {
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    [data-theme="console"] .theme-section > h3,
    [data-theme="savanna"] .theme-section > h3,
    [data-theme="fil"] .theme-section > h3,
    [data-theme="bmms"] .theme-section > h3,
    [data-theme="halloween"] .theme-section > h3,
    [data-theme="thanksgiving"] .theme-section > h3 {
      margin: 0;
      padding: 0.6rem 1rem;
      background: var(--section-title-bg);
      color: var(--section-title-text);
    }
    [data-theme="console"] .theme-section > :not(h3),
    [data-theme="savanna"] .theme-section > :not(h3),
    [data-theme="fil"] .theme-section > :not(h3),
    [data-theme="bmms"] .theme-section > :not(h3),
    [data-theme="halloween"] .theme-section > :not(h3),
    [data-theme="thanksgiving"] .theme-section > :not(h3) {
      margin-left: 1rem;
      margin-right: 1rem;
    }
    [data-theme="console"] .theme-section > *:last-child,
    [data-theme="savanna"] .theme-section > *:last-child,
    [data-theme="fil"] .theme-section > *:last-child,
    [data-theme="bmms"] .theme-section > *:last-child,
    [data-theme="halloween"] .theme-section > *:last-child,
    [data-theme="thanksgiving"] .theme-section > *:last-child {
      margin-bottom: 1rem;
    }
    [data-theme="console"] .theme-section > table,
    [data-theme="savanna"] .theme-section > table,
    [data-theme="fil"] .theme-section > table,
    [data-theme="bmms"] .theme-section > table,
    [data-theme="halloween"] .theme-section > table,
    [data-theme="thanksgiving"] .theme-section > table {
      /* The one child that should reach the section's own edges rather
         than sit inset like everything else - a table's own header row
         already reads as a boundary, and insetting it just wastes width
         a table specifically wants. */
      margin-left: 0;
      margin-right: 0;
      width: 100%;
    }

    /* Savanna-specific: the sidebar's background photo (see themes.py
       for its source/license) instead of a flat color - added after the
       shared header rule above so its background-image (a separate
       longhand property) layers on top of that rule's own
       background-color without needing to repeat every other header
       property here too. A dark scrim (the two identical color stops in
       each linear-gradient - not really a "gradient", just a flat tint
       stacked on top of the photo) keeps the light nav text readable
       against the photo's own bright band of sunset-orange sky; dark
       mode uses a heavier one, evoking dusk rather than daybreak over
       the same image, same idea as Console's own light/dark sidebar
       distinction. Nav text and hover state are overridden to a fixed
       light color regardless of mode - unlike Console, where --text
       already provides enough contrast against a flat sidebar color in
       both modes, a photo's own brightness varies across it, so a single
       reliably-light color (plus the scrim above) is what actually stays
       readable everywhere on it, in either mode. */
    [data-theme="savanna"] header {
      background-image: linear-gradient(rgba(20, 10, 5, 0.35), rgba(20, 10, 5, 0.35)), url("/static/theme-savanna-sunset.jpg");
      background-size: cover;
      background-position: left center;
    }
    [data-theme="savanna"][data-mode="dark"] header {
      background-image: linear-gradient(rgba(10, 5, 5, 0.65), rgba(10, 5, 5, 0.65)), url("/static/theme-savanna-sunset.jpg");
    }
    [data-theme="savanna"] header,
    [data-theme="savanna"] header a {
      color: #fdf6ec;
    }
    [data-theme="savanna"] header a:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    [data-theme="savanna"] header form button {
      background: var(--section-title-bg);
      color: var(--section-title-text);
      border: none;
    }

    /* BMMS-specific: the same "fixed light nav text regardless of mode"
       override as Savanna above, for the same reason - --sidebar-bg
       here is a fixed maroon in both light and dark mode rather than
       something that flips with Console's own light/dark distinction,
       so --text (dark in light mode, for readability against the
       *content* area) isn't reliably readable against it either. */
    [data-theme="bmms"] header,
    [data-theme="bmms"] header a {
      color: #f0dfb0;
    }
    [data-theme="bmms"] header a:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    [data-theme="bmms"] header form button {
      background: var(--section-title-bg);
      color: var(--section-title-text);
      border: none;
    }

    /* Halloween-specific: the sidebar's background scene (see
       theme-halloween-manor.svg's own top comment for why it's a
       portrait composition, not a landscape one like Savanna's photo)
       plus the same "fixed light nav text regardless of mode" override
       Savanna/BMMS both already need, for the same reason - the scene's
       own brightness varies across it, so a single reliably-light color
       (plus the scrim below) is what stays readable everywhere on it in
       either mode. Dark mode's scrim is only slightly heavier than
       light's, unlike Savanna's day-vs-dusk jump - this is already a
       night scene either way, it just needs a touch more dimming so the
       *content* side of the page (--content-bg, genuinely different
       between the two modes) doesn't read as brighter than its own
       sidebar. */
    [data-theme="halloween"] header {
      background-image: linear-gradient(rgba(10, 5, 20, 0.25), rgba(10, 5, 20, 0.25)), url("/static/theme-halloween-manor.svg");
      background-size: cover;
      background-position: center top;
    }
    [data-theme="halloween"][data-mode="dark"] header {
      background-image: linear-gradient(rgba(5, 2, 10, 0.45), rgba(5, 2, 10, 0.45)), url("/static/theme-halloween-manor.svg");
    }
    [data-theme="halloween"] header,
    [data-theme="halloween"] header a {
      color: #f4eeff;
    }
    [data-theme="halloween"] header a:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    [data-theme="halloween"] header form button {
      background: var(--section-title-bg);
      color: var(--section-title-text);
      border: none;
    }

    /* Thanksgiving-specific: the sidebar's background scene (see
       theme-thanksgiving-harvest.svg) plus the same fixed light nav
       text override every photo/art-backed sidebar theme in this app
       already needs, for the same reason. Unlike Halloween's night
       scene, this is a warm dusk - dark mode's scrim is noticeably
       heavier than light's here (not just "a touch," Halloween's own
       description), since the scene's own base colors are much
       brighter to start with and need more dimming to sit comfortably
       next to dark mode's near-black content area. */
    [data-theme="thanksgiving"] header {
      background-image: linear-gradient(rgba(20, 8, 5, 0.2), rgba(20, 8, 5, 0.2)), url("/static/theme-thanksgiving-harvest.svg");
      background-size: cover;
      background-position: center top;
    }
    [data-theme="thanksgiving"][data-mode="dark"] header {
      background-image: linear-gradient(rgba(10, 4, 2, 0.55), rgba(10, 4, 2, 0.55)), url("/static/theme-thanksgiving-harvest.svg");
    }
    [data-theme="thanksgiving"] header,
    [data-theme="thanksgiving"] header a {
      color: #fff3d6;
    }
    [data-theme="thanksgiving"] header a:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    [data-theme="thanksgiving"] header form button {
      background: var(--section-title-bg);
      color: var(--section-title-text);
      border: none;
    }

    /* Fil-specific: the two mascot images (see the <body> markup below
       and theme-fil-*.svg) - both <img> tags are always present in the
       markup on every theme, so JS never needs to add/remove them; they
       just stay hidden except under this one theme. Fixed positioning
       (not part of the normal document flow) so they float over the
       page the same way a real desk mascot would sit on top of a
       screen, rather than pushing any real content around; pointer-
       events: none by default so they can never intercept a click meant
       for whatever happens to be underneath them - overridden back to
       auto on each one below, since a native title-attribute tooltip
       (see the <img> tags' own title="") needs an element to actually
       receive the hover for the browser to show it at all. Both are
       small and sit mostly over padding/gutter space rather than real
       controls, so the trade-off stays worth it for a hover greeting -
       revisit if either one ever ends up sitting on top of something
       actually clickable. */
    .fil-peek, .fil-hang {
      display: none;
      position: fixed;
      pointer-events: none;
      z-index: 5;
    }
    /* Positioned so the svg's own left edge - where his body is cut off,
       showing only the near half of him (see theme-fil-peek.svg's own
       comment) - lines up exactly with the sidebar's own 220px width
       (the shared header rule's flex-basis above), so he reads as
       leaning out from behind its edge into the content area, the same
       "peek around a corner" pose the user asked for. */
    [data-theme="fil"] .fil-peek {
      display: block;
      left: 220px;
      top: 38vh;
      width: 56px;
      height: auto;
      pointer-events: auto;
    }
    /* Hangs from the top of the browser window itself, gripping his own
       strand of filament with one hand (drawn into the svg's own top
       edge) - like a kid on playground monkey bars, not by his neck (an
       earlier version attached the strand to his head instead of a
       hand, which read as a noose on review - wrong for a school app,
       fixed here). The gentle swing below is slow and small on purpose
       - a mascot, not a distraction from the actual queue/job data next
       to it. */
    [data-theme="fil"] .fil-hang {
      display: block;
      top: 0;
      right: 60px;
      width: 90px;
      height: auto;
      transform-origin: top center;
      animation: fil-swing 6s ease-in-out infinite;
      pointer-events: auto;
    }
    @keyframes fil-swing {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    /* Halloween-specific: the hanging spider (see the <body> markup
       below and theme-halloween-spider.svg) - same fixed-position/
       hangs-from-the-top-edge/gentle-swing treatment as Fil's own
       .fil-hang above (same slot, even - top: 0, right: 60px - since
       only one of the two themes is ever active on a given page), just
       a different class/image and a slightly slower, smaller sway,
       since a spider on a web thread drifts rather than swings on
       purpose the way Fil's yoyo trick does. */
    .halloween-spider {
      display: none;
      position: fixed;
      pointer-events: none;
      z-index: 5;
    }
    [data-theme="halloween"] .halloween-spider {
      display: block;
      top: 0;
      right: 60px;
      width: 80px;
      height: auto;
      transform-origin: top center;
      animation: spider-sway 7s ease-in-out infinite;
      pointer-events: auto;
    }
    @keyframes spider-sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    /* Thanksgiving-specific: the turkey (see the <body> markup below
       and theme-thanksgiving-turkey.svg) - unlike Fil's .fil-hang and
       Halloween's .halloween-spider above, this stands at the *bottom*
       of the window (bottom: 0), not the top. A first version put it in
       that same top-edge slot, feet gripping the edge the way Fil's
       fist does - checked against a real render and found to just read
       as "hanging," odd for a bird, unlike Fil (a filament creature) or
       a spider (a strand of web is completely ordinary for it), neither
       of which have a standing pose to fall back on anyway. Standing at
       the bottom instead needs no edge-gripping concept at all - see
       the SVG's own top comment. Same idea, a gentle bob rather than a
       rotating swing, for the same reason as before: standing, not
       hanging/swinging from anything. */
    .thanksgiving-turkey {
      display: none;
      position: fixed;
      pointer-events: none;
      z-index: 5;
    }
    [data-theme="thanksgiving"] .thanksgiving-turkey {
      display: block;
      bottom: 0;
      right: 60px;
      width: 85px;
      height: auto;
      animation: turkey-bob 5s ease-in-out infinite;
      pointer-events: auto;
    }
    @keyframes turkey-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* BMMS-specific: the school's own logo (app/static/bmms-logo.png),
       shown near the "queue3d" title in the sidebar header - always in
       the markup (see the <body> below), hidden by default the same way
       Fil's mascot images are, so nothing but CSS has to know which
       theme is active. align-self overrides the header's own
       align-items: stretch (every other header child is meant to fill
       the sidebar's width; the logo should just be its own size,
       centered) - unlike Fil's images, this one sits in normal document
       flow (not position: fixed) since it's part of the header's own
       layout, not a floating decoration on top of the page. Sized as a
       percentage of the sidebar's own width (not a fixed px value) per
       the user, after an initial smaller version read as "small and
       hard to read." */
    .bmms-logo {
      display: none;
    }
    [data-theme="bmms"] .bmms-logo {
      display: block;
      align-self: center;
      width: 85%;
      height: auto;
      margin-bottom: 0.75rem;
    }
  </style>
  <script>
    // The one part of any sidebar-layout theme (Console, Savanna - see
    // themes.py) that genuinely needs script, not just CSS: grouping
    // each <h3> and the content that follows it - up to the next <h3>,
    // or the end of the page - into one bordered box (.theme-section,
    // styled above). CSS has no selector for "these siblings, up to a
    // stopping point," and every theme before Console only needed color
    // swaps, so there was nothing here to hook into before it existed.
    // Shared by every theme that wants this treatment (SECTION_THEMES
    // below), not copy-pasted per theme, and re-run after every htmx
    // swap (some sections - the jobs table, the printer status banner -
    // replace themselves via hx-swap), not just on initial load, so a
    // background refresh can't silently leave a swapped-in section
    // unboxed.
    const SECTION_THEMES = ["console", "savanna", "fil", "bmms", "halloween", "thanksgiving"];
    function applyThemeSections() {
      if (!SECTION_THEMES.includes(document.documentElement.getAttribute("data-theme"))) return;
      // A descendant selector, not just direct children of <main> - some
      // section headings (_jobs_table.html's "Your submissions") sit
      // inside their own wrapper div (#jobs-table, swapped wholesale by
      // htmx), not straight under <main> like most others. The wrapping
      // below only ever touches the heading's own immediate siblings
      // either way, so it groups correctly at whatever depth a given
      // heading actually sits at.
      document.querySelectorAll("main h3").forEach((heading) => {
        if (heading.parentElement.classList.contains("theme-section")) return; // already wrapped
        const section = document.createElement("div");
        section.className = "theme-section";
        heading.replaceWith(section);
        section.appendChild(heading);
        // Stops at the next H3 *or* the page's own <footer> - without
        // the second check, a page whose last section has nothing after
        // it but the "queue3d vX.Y.Z" footer (base.html always renders
        // one right after the page's own content) swept that footer
        // inside the section's own box too, a real bug caught by
        // actually looking at a rendered page rather than just reading
        // the CSS.
        let next = section.nextSibling;
        while (next && !(next.nodeType === 1 && (next.tagName === "H3" || next.tagName === "FOOTER"))) {
          const after = next.nextSibling;
          section.appendChild(next);
          next = after;
        }
      });
    }
    document.addEventListener("DOMContentLoaded", applyThemeSections);
    // document, not document.body - this script runs in <head>, before
    // <body> exists yet, so document.body would be null here.
    document.addEventListener("htmx:afterSwap", applyThemeSections);
  </script>
</head>
<body>
  <!-- Fil's two mascot poses (see the .fil-peek/.fil-hang CSS above) -
       always in the markup, hidden by CSS on every theme but Fil. Each
       carries a title="" for a plain native hover tooltip - purely a
       mouse-hover flourish (neither image is keyboard-focusable), so
       aria-hidden stays true; nothing accessibility-relevant lives in
       either tooltip's text. -->
  <img src="/static/theme-fil-peek.svg" alt="" aria-hidden="true" class="fil-peek" title="Peek-a-boo">
  <img src="/static/theme-fil-hang.svg" alt="" aria-hidden="true" class="fil-hang" title="Hi, I'm Fil">
  <!-- Halloween's own hanging mascot - same always-in-the-markup,
       hidden-except-under-its-own-theme treatment as Fil's pair above. -->
  <img src="/static/theme-halloween-spider.svg" alt="" aria-hidden="true" class="halloween-spider" title="Boo!">
  <!-- Thanksgiving's own mascot - same always-in-the-markup,
       hidden-except-under-its-own-theme treatment as the two pairs
       above. -->
  <img src="/static/theme-thanksgiving-turkey.svg" alt="" aria-hidden="true" class="thanksgiving-turkey" title="Gobble gobble!">
  <header>
    <img src="/static/bmms-logo.png" alt="Black Mountain Middle School Raiders logo" class="bmms-logo">
    <h1>queue3d</h1>
    {% block nav %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
    <footer>queue3d v{{ APP_VERSION }}</footer>
  </main>
</body>
</html>
