{% extends "base.html" %}
{% block title %}Log in - queue3d{% endblock %}
{% block content %}
  <h2>Log in</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Name<br><input name="name" value="{{ name or '' }}" required autofocus></label>
    <label>PIN<br><input name="pin" type="password" inputmode="numeric" required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="/signup">Sign up</a> instead.</p>
  <p class="muted"><a href="/admin/login">Admin log in</a></p>
{% endblock %}
