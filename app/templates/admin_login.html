{% extends "base.html" %}
{% block title %}Admin log in - queue3d{% endblock %}
{% block content %}
  <!-- .login-page (base.html) centers all of this - logo, heading, form
       - per the user. The logo itself is always shown here regardless
       of theme - per the user, the school's own logo belongs on the
       login page even though current_theme() always resolves to
       "default" for a logged-out request (see templates_env.py), so the
       BMMS theme's own CSS can never reach this page. See
       app/README.md's "BMMS" theme section. -->
  <div class="login-page">
    <img src="/static/bmms-logo.png" alt="Black Mountain Middle School Raiders logo" class="login-logo">
    <h2>Admin log in</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label>Username<br><input name="username" value="{{ username or '' }}" required autofocus></label>
      <label>Password<br><input name="password" type="password" required></label>
      <button type="submit">Log in</button>
    </form>
    <p class="muted">Admin accounts are created by whoever runs the server (see create_admin.py) - there's no self-signup here on purpose.</p>
  </div>
{% endblock %}
