{% extends "base.html" %}
{% block title %}Preview - queue3d{% endblock %}
{% block content %}
  <h2>{{ job.original_filename }}</h2>
  <p class="muted">
    Orange lines are generated support material (simplified - not the
    exact print path, just roughly where supports will be).
  </p>

  <div id="preview-container" class="preview-container"></div>
  <p id="preview-info" class="preview-info"></p>
  <p><a href="javascript:history.back()">&laquo; Back</a></p>

  <script type="importmap">
    { "imports": { "three": "/static/vendor/three/three.module.min.js" } }
  </script>
  <script type="module">
    import { previewUrl, applyTransform } from "/static/preview.js";
    const container = document.getElementById("preview-container");
    const info = document.getElementById("preview-info");
    const supportsUrl = {% if job.supports_enabled %}"/jobs/{{ job.id }}/supports.json"{% else %}null{% endif %};
    // The stored model file is always the original, unscaled/unrotated
    // upload - scaling and rotation only ever happen transiently during
    // slicing (see slicing/stl_to_3mf.build_3mf), never rewriting the
    // file itself - so a job sliced with either needs that reapplied
    // here too, or this read-only view would silently show the wrong
    // size/orientation for anything already queued/approved/printing/done.
    const transform = {
      scale: {{ job.scale_factor }},
      rotateX: {{ job.rotate_x }},
      rotateY: {{ job.rotate_y }},
      rotateZ: {{ job.rotate_z }},
    };
    previewUrl("/jobs/{{ job.id }}/model.stl", supportsUrl, container, info).then(() => {
      if (transform.scale !== 1 || transform.rotateX || transform.rotateY || transform.rotateZ) {
        applyTransform(transform);
      }
    });
  </script>
{% endblock %}
