{% extends "base.html" %}
{% block title %}Preview - queue3d{% endblock %}
{% block content %}
  <h2>{{ job.original_filename }}</h2>
  <p class="muted">
    Orange lines are generated support material (simplified - not the
    exact print path, just roughly where supports will be).
  </p>

  <div id="preview-container" class="preview-container"></div>
  <p id="preview-info" class="preview-info"></p>
  <p><a href="javascript:history.back()">&laquo; Back</a></p>

  <script type="importmap">
    { "imports": { "three": "/static/vendor/three/three.module.min.js" } }
  </script>
  <script type="module">
    import { previewUrl } from "/static/preview.js";
    const container = document.getElementById("preview-container");
    const info = document.getElementById("preview-info");
    const supportsUrl = {% if job.supports_enabled %}"/jobs/{{ job.id }}/supports.json"{% else %}null{% endif %};
    previewUrl("/jobs/{{ job.id }}/model.stl", supportsUrl, container, info);
  </script>
{% endblock %}
