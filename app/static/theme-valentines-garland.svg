<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 110" width="260" height="110">
  <!-- Valentine's Day theme's garland of heart bunting (see themes.py/
       base.html) - originally part of theme-valentines-hearts.svg,
       strung across the top of the sidebar directly behind the header's
       own nav text. Moved here, its own small standalone banner over
       the top-right corner of the *content* panel instead, after the
       user saw it live: "the white text on the pink background are
       difficult to read, especially with the heart banner behind it."
       Nothing sits in front of this spot to conflict with, the same
       reason every other theme's own decorative art stays clear of
       wherever its nav text actually renders. Transparent background -
       layered on top of the content panel's own background color via
       `[data-theme="valentines"] main`'s own background-image rule, not
       a flat rectangle. -->
  <defs>
    <path id="gheart" d="M0,8 C-5,0 -14,-2 -14,-9 C-14,-15 -9,-18 -4,-15 C-2,-14 0,-11 0,-9 C0,-11 2,-14 4,-15 C9,-18 14,-15 14,-9 C14,-2 5,0 0,8 Z"/>
  </defs>
  <path d="M5,15 Q130,48 255,15" stroke="#5c3a24" stroke-width="2" fill="none" opacity="0.8"/>
  <g stroke="#5c3a24" stroke-width="1.6" opacity="0.8">
    <line x1="35" y1="22" x2="35" y2="36"/>
    <line x1="95" y1="38" x2="95" y2="52"/>
    <line x1="150" y1="44" x2="150" y2="58"/>
    <line x1="205" y1="38" x2="205" y2="52"/>
    <line x1="235" y1="22" x2="235" y2="36"/>
  </g>
  <use href="#gheart" transform="translate(35,44) scale(0.6)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.3"/>
  <use href="#gheart" transform="translate(95,60) scale(0.6)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.3"/>
  <use href="#gheart" transform="translate(150,66) scale(0.6)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.3"/>
  <use href="#gheart" transform="translate(205,60) scale(0.6)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.3"/>
  <use href="#gheart" transform="translate(235,44) scale(0.6)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.3"/>
</svg>
