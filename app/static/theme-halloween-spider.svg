<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Halloween theme's hanging mascot (see themes.py/base.html) - in
       the exact same "hangs from the top edge of the window" slot Fil
       uses under the Fil theme (see theme-fil-hang.svg), just a cute
       spider instead. Unlike Fil, a strand of web running from the top
       edge down to the spider is completely ordinary spider imagery
       (how a real spider actually hangs), not something that needs
       Fil's own "grip a fist directly to the edge, no separate strand"
       workaround - so it's drawn the natural way, one thread, no
       ambiguity. Round, smiling, and small - no fangs, no extra hairy
       legs-as-spikes look; the same "school-appropriate," nothing-
       frightening bar every other Halloween-theme asset in this app
       follows.

       Unlike Fil (a fixed teal that reads fine against either of Fil's
       own page backgrounds), this floats over the main content area,
       not a dark sidebar image, and that area's own bg/content-bg tokens
       flip from near-white to near-black between light/dark mode (see
       base.html's [data-theme="halloween"] tokens). A first version
       used one dark purple fill/stroke throughout - checked against a
       real dark-mode render and found "just a round object with eyes,"
       a real legibility complaint: dark-on-near-black has almost no
       edge to read, the same problem the manor scene's own silhouette
       had before its own fix (see theme-halloween-manor.svg). Fixed
       with a brighter violet fill (readable against both extremes on
       its own) plus a "sticker" double-stroke on every leg - a thicker
       light backing line under a thinner dark one - so there's always
       one half of that pair with real contrast against whatever's
       actually behind it, light or dark. -->

  <!-- the web strand, anchored directly to the top edge -->
  <line x1="50" y1="0" x2="50" y2="46" stroke="#5c4b7a" stroke-width="2" stroke-linecap="round"/>
  <!-- a couple of small anchor threads, like a real web's top attachment -->
  <line x1="50" y1="8" x2="38" y2="0" stroke="#5c4b7a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="8" x2="62" y2="0" stroke="#5c4b7a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- back legs (behind the body) - light backing stroke first, then
       the darker line on top of it, on every leg -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#f4eeff" stroke-width="5.5">
      <path d="M38,64 Q18,58 8,66"/>
      <path d="M38,72 Q16,72 6,80"/>
      <path d="M62,64 Q82,58 92,66"/>
      <path d="M62,72 Q84,72 94,80"/>
    </g>
    <g stroke="#4a2f8a" stroke-width="3">
      <path d="M38,64 Q18,58 8,66"/>
      <path d="M38,72 Q16,72 6,80"/>
      <path d="M62,64 Q82,58 92,66"/>
      <path d="M62,72 Q84,72 94,80"/>
    </g>
  </g>

  <!-- body - a light backing ring first, then the real fill/outline on
       top, same "always half the pair has contrast" idea as the legs -->
  <circle cx="50" cy="78" r="27.5" fill="none" stroke="#f4eeff" stroke-width="3"/>
  <circle cx="50" cy="78" r="26" fill="#8a5fe0" stroke="#4a2f8a" stroke-width="2.5"/>

  <!-- front legs (in front of the body outline, same double-stroke) -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#f4eeff" stroke-width="5.5">
      <path d="M32,86 Q14,88 6,98"/>
      <path d="M32,94 Q16,102 10,112"/>
      <path d="M68,86 Q86,88 94,98"/>
      <path d="M68,94 Q84,102 90,112"/>
    </g>
    <g stroke="#4a2f8a" stroke-width="3">
      <path d="M32,86 Q14,88 6,98"/>
      <path d="M32,94 Q16,102 10,112"/>
      <path d="M68,86 Q86,88 94,98"/>
      <path d="M68,94 Q84,102 90,112"/>
    </g>
  </g>

  <!-- googly eyes -->
  <circle cx="41" cy="70" r="8" fill="#ffffff"/>
  <circle cx="59" cy="70" r="8" fill="#ffffff"/>
  <circle cx="40" cy="71" r="3.6" fill="#241a3a"/>
  <circle cx="60" cy="71" r="3.6" fill="#241a3a"/>

  <!-- a small friendly smile -->
  <path d="M42,86 Q50,92 58,86" stroke="#241a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- a little bow, for a friendly touch rather than anything menacing -
       already bright enough (matches the manor scene's own pumpkin
       glow) to read against either background on its own. -->
  <path d="M50,58 L40,52 L40,64 Z" fill="#ff8a1e"/>
  <path d="M50,58 L60,52 L60,64 Z" fill="#ff8a1e"/>
  <circle cx="50" cy="58" r="3.5" fill="#e8720c"/>
</svg>
