<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Fil's own strand of filament, doubling as the thread he hangs from -->
  <line x1="50" y1="0" x2="50" y2="28" stroke="#7a6248" stroke-width="3" stroke-linecap="round"/>

  <!-- arms, thrown up in a "wheee" pose -->
  <path d="M27,60 Q8,46 6,26" stroke="#12b5a6" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M73,60 Q92,46 94,26" stroke="#12b5a6" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="6" cy="26" r="5" fill="#12b5a6"/>
  <circle cx="94" cy="26" r="5" fill="#12b5a6"/>

  <!-- legs, dangling and kicked out mid-swing -->
  <path d="M40,82 Q32,102 22,116" stroke="#12b5a6" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M60,82 Q70,100 82,112" stroke="#12b5a6" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="22" cy="116" r="5" fill="#12b5a6"/>
  <circle cx="82" cy="112" r="5" fill="#12b5a6"/>

  <!-- body - a friendly spool-of-filament face -->
  <circle cx="50" cy="55" r="30" fill="#12b5a6" stroke="#0d8478" stroke-width="3"/>

  <!-- eyes -->
  <circle cx="39" cy="50" r="6" fill="#ffffff"/>
  <circle cx="61" cy="50" r="6" fill="#ffffff"/>
  <circle cx="40" cy="51" r="2.6" fill="#123330"/>
  <circle cx="62" cy="51" r="2.6" fill="#123330"/>

  <!-- big happy smile -->
  <path d="M36,63 Q50,76 64,63" stroke="#0d3f39" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- rosy cheeks -->
  <circle cx="31" cy="60" r="4" fill="#ff9d8a" opacity="0.6"/>
  <circle cx="69" cy="60" r="4" fill="#ff9d8a" opacity="0.6"/>
</svg>
