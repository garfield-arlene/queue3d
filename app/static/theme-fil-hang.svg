<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" width="100" height="125">
  <!-- Fil, hanging by ONE HAND directly from the top edge - like a kid
       on playground monkey bars, not by his neck. Two things caught on
       the user's own report and fixed here, both real appropriateness
       misses for a school app: an earlier pass ran a thread from the
       top edge down to a closed fist, which read as an obscene gesture
       rather than a grip - fixed by having the fist itself touch the
       top edge directly, no separate strand drawn above it; a second
       pass then had a decorative hair curl reaching up near the top of
       his head, which read as a second strand and brought back the
       noose look even with the grip fixed - fixed by moving it off to
       the side at head height instead. Swings a miniature spool below
       him like a yoyo with his free hand. -->

  <!-- the gripping arm, raised straight up so his fist touches the top
       edge directly - no separate strand/thread drawn above the fist -->
  <path d="M60,42 Q44,24 44,6" stroke="#12b5a6" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- his closed fist, gripping the top of the window itself -->
  <circle cx="44" cy="5" r="5" fill="#12b5a6" stroke="#0d8478" stroke-width="2"/>

  <!-- a loose curl of filament, like a stray bit of hair - off to the
       side at head height, well clear of the top edge -->
  <path d="M76,27 Q85,25 82,33 Q80,37 87,37" stroke="#0d8478" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- head - a small wound ball of filament -->
  <circle cx="62" cy="30" r="13" fill="#12b5a6" stroke="#0d8478" stroke-width="2.5"/>

  <!-- googly eyes -->
  <circle cx="57" cy="28" r="5.5" fill="#ffffff" stroke="#0d8478" stroke-width="1"/>
  <circle cx="67" cy="28" r="5.5" fill="#ffffff" stroke="#0d8478" stroke-width="1"/>
  <circle cx="56" cy="29" r="2.4" fill="#123330"/>
  <circle cx="68" cy="29" r="2.4" fill="#123330"/>

  <!-- a scribbled, slightly goofy marker-drawn mouth -->
  <path d="M55,39 L59,42 L63,38 L67,42 L71,39" stroke="#0d3f39" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- rosy cheeks -->
  <circle cx="53" cy="35" r="2.6" fill="#ff9d8a" opacity="0.6"/>
  <circle cx="71" cy="35" r="2.6" fill="#ff9d8a" opacity="0.6"/>

  <!-- torso - one bent length of filament wire -->
  <line x1="60" y1="43" x2="60" y2="73" stroke="#12b5a6" stroke-width="6" stroke-linecap="round"/>

  <!-- free arm, swinging the yoyo -->
  <path d="M60,50 Q45,58 38,70" stroke="#12b5a6" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="38" cy="70" r="4.5" fill="#12b5a6"/>

  <!-- legs, dangling loosely while he swings -->
  <path d="M60,73 Q50,93 44,110" stroke="#12b5a6" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="44" cy="110" r="4.5" fill="#12b5a6"/>
  <path d="M60,73 Q70,93 78,110" stroke="#12b5a6" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="78" cy="110" r="4.5" fill="#12b5a6"/>

  <!-- a faint motion swoosh, selling the yoyo swing -->
  <path d="M4,90 A22,22 0 0,1 26,122" stroke="#7a6248" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="3,4" opacity="0.45"/>

  <!-- the yoyo string, from his hand down to the spool -->
  <line x1="38" y1="70" x2="18" y2="106" stroke="#7a6248" stroke-width="2" stroke-linecap="round"/>

  <!-- the yoyo itself - a miniature spool of filament, seen from the
       side (outer flange, one wound band, the center hole) -->
  <circle cx="18" cy="108" r="9" fill="#12b5a6" stroke="#0d8478" stroke-width="2"/>
  <circle cx="18" cy="108" r="6" fill="none" stroke="#3fcabb" stroke-width="1.2" opacity="0.5"/>
  <circle cx="18" cy="108" r="1.8" fill="#0a655a"/>
</svg>
