<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <!-- Valentine's Day theme's own mascot (see themes.py/base.html) -
       standing at the bottom of the window, same slot/reasoning as the
       Thanksgiving turkey/Winter snowman: a teddy bear has an obvious
       standing pose, no edge-gripping/hanging concept needed. A warm
       medium brown, unlike Winter's white snowman or Thanksgiving's own
       mid-toned turkey - reads clearly against both a light and a
       near-black dark-mode content background on its own, so this one
       skips the double-stroke "sticker" treatment those two needed. -->
  <defs>
    <path id="bheart" d="M0,8 C-5,0 -14,-2 -14,-9 C-14,-15 -9,-18 -4,-15 C-2,-14 0,-11 0,-9 C0,-11 2,-14 4,-15 C9,-18 14,-15 14,-9 C14,-2 5,0 0,8 Z"/>
  </defs>

  <!-- feet -->
  <ellipse cx="45" cy="138" rx="13" ry="9" fill="#b5793f" stroke="#5c3a1a" stroke-width="2"/>
  <ellipse cx="75" cy="138" rx="13" ry="9" fill="#b5793f" stroke="#5c3a1a" stroke-width="2"/>
  <ellipse cx="45" cy="140" rx="6" ry="3.5" fill="#e8c39e"/>
  <ellipse cx="75" cy="140" rx="6" ry="3.5" fill="#e8c39e"/>

  <!-- body -->
  <ellipse cx="60" cy="100" rx="28" ry="32" fill="#b5793f" stroke="#5c3a1a" stroke-width="2"/>
  <ellipse cx="60" cy="105" rx="16" ry="20" fill="#e8c39e" opacity="0.9"/>

  <!-- arms, hugging in toward the heart held in front -->
  <g stroke="#b5793f" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M36,86 Q26,100 44,112"/>
    <path d="M84,86 Q94,100 76,112"/>
  </g>
  <g stroke="#5c3a1a" stroke-width="2" fill="none">
    <path d="M36,86 Q26,100 44,112"/>
    <path d="M84,86 Q94,100 76,112"/>
  </g>

  <!-- the heart, held against the chest -->
  <use href="#bheart" transform="translate(60,100) scale(1.3)" fill="#c0392b" stroke="#7a1f18" stroke-width="2"/>

  <!-- paws, hugging the heart's sides -->
  <circle cx="45" cy="108" r="9" fill="#b5793f" stroke="#5c3a1a" stroke-width="2"/>
  <circle cx="75" cy="108" r="9" fill="#b5793f" stroke="#5c3a1a" stroke-width="2"/>

  <!-- head -->
  <circle cx="60" cy="50" r="22" fill="#b5793f" stroke="#5c3a1a" stroke-width="2"/>
  <circle cx="42" cy="30" r="9" fill="#b5793f" stroke="#5c3a1a" stroke-width="2"/>
  <circle cx="78" cy="30" r="9" fill="#b5793f" stroke="#5c3a1a" stroke-width="2"/>
  <circle cx="42" cy="30" r="4.5" fill="#e8c39e"/>
  <circle cx="78" cy="30" r="4.5" fill="#e8c39e"/>

  <!-- muzzle, nose, and a scribbled friendly mouth -->
  <ellipse cx="60" cy="56" rx="11" ry="8" fill="#e8c39e"/>
  <ellipse cx="60" cy="51" rx="4" ry="3" fill="#5c3a1a"/>
  <path d="M52,60 Q56,63 60,61 Q64,63 68,60" stroke="#5c3a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- googly-ish round eyes -->
  <circle cx="52" cy="45" r="3" fill="#2a1a10"/>
  <circle cx="68" cy="45" r="3" fill="#2a1a10"/>
</svg>
