<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" width="60" height="100">
  <!-- Fil peeking around the sidebar's own right edge - facing the user
       head-on (not in profile, per the user), leaning his head out from
       behind the corner with one hand gripping the edge; the rest of
       him stays hidden behind it. -->

  <!-- a loose curl of filament, like a stray bit of hair -->
  <path d="M40,18 Q48,14 44,8 Q41,4 46,2" stroke="#0d8478" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- head - a small wound ball of filament -->
  <circle cx="26" cy="35" r="22" fill="#12b5a6" stroke="#0d8478" stroke-width="2.5"/>

  <!-- googly eyes, both visible, looking straight out at the viewer -->
  <circle cx="18" cy="32" r="6.5" fill="#ffffff" stroke="#0d8478" stroke-width="1"/>
  <circle cx="34" cy="32" r="6.5" fill="#ffffff" stroke="#0d8478" stroke-width="1"/>
  <circle cx="17" cy="33" r="2.8" fill="#123330"/>
  <circle cx="35" cy="33" r="2.8" fill="#123330"/>

  <!-- a scribbled, slightly goofy marker-drawn mouth -->
  <path d="M15,48 L20,52 L26,47 L32,52 L37,48" stroke="#0d3f39" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- rosy cheeks -->
  <circle cx="12" cy="42" r="3" fill="#ff9d8a" opacity="0.6"/>
  <circle cx="40" cy="42" r="3" fill="#ff9d8a" opacity="0.6"/>

  <!-- an arm stub connecting down to the hand, the rest of him implied
       to be hidden behind the corner below/out of frame -->
  <path d="M14,55 Q7,66 9,78" stroke="#12b5a6" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- a hand curling around the corner, gripping the edge -->
  <ellipse cx="10" cy="82" rx="10" ry="7" fill="#12b5a6" stroke="#0d8478" stroke-width="2.5"/>
</svg>
