<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 108" width="40" height="108">
  <!-- Fil peeking around the sidebar's own right edge - per the user,
       showing the right half of his whole body (head, torso, one arm,
       one leg), not just a floating head. Drawn as a full figure
       straddling this SVG's own left edge (which lines up exactly with
       the sidebar's right edge once positioned - see base.html) so the
       left half of him is simply never drawn, the same idea as before,
       just extended down his whole body instead of stopping at the
       head. He faces the viewer (no profile view). -->

  <!-- a loose curl of filament, like a stray bit of hair -->
  <path d="M11,10 Q19,6 15,0" stroke="#0d8478" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- head - a small wound ball of filament -->
  <circle cx="0" cy="24" r="13" fill="#12b5a6" stroke="#0d8478" stroke-width="2.5"/>

  <!-- his one visible (right) eye -->
  <circle cx="6" cy="21" r="6" fill="#ffffff" stroke="#0d8478" stroke-width="1"/>
  <circle cx="7" cy="22" r="2.6" fill="#123330"/>

  <!-- the visible half of his scribbled mouth -->
  <path d="M0,33 L4,36 L9,32" stroke="#0d3f39" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- one rosy cheek -->
  <circle cx="10" cy="29" r="2.8" fill="#ff9d8a" opacity="0.6"/>

  <!-- torso - the near half of the same bent-wire body, its far edge
       running off the canvas's own left side -->
  <line x1="5" y1="39" x2="5" y2="65" stroke="#12b5a6" stroke-width="10" stroke-linecap="butt"/>

  <!-- his near arm, reaching out into view -->
  <path d="M5,44 Q20,48 26,38" stroke="#12b5a6" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="26" cy="38" r="4.5" fill="#12b5a6"/>

  <!-- his near leg, stepping into view -->
  <path d="M5,65 Q15,84 13,104" stroke="#12b5a6" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="13" cy="104" r="4.5" fill="#12b5a6"/>
</svg>
