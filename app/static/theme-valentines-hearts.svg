<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1000" width="300" height="1000">
  <!-- Valentine's Day theme's sidebar scene (see themes.py/base.html) -
       a cozy pink-and-red dusk scene: drifting hearts, a heart-blossom
       tree flanked by two small rose bushes, a low picket fence with
       heart-outline cutouts, and a classic overflowing valentine
       mailbox standing in the foreground. Deliberately just hearts and
       a card-exchange mailbox - the familiar "put your valentines in
       the classroom mailbox" image every elementary/middle schooler
       already knows - nothing romantic beyond that, the same
       "school-appropriate for everyone" bar every other seasonal theme
       here follows.

       No garland of heart bunting across the top here any more - a
       first version had one, strung directly behind the header's own
       nav column the same way Halloween's bats/Winter's snowflakes sit
       behind theirs. Those read fine because they're soft and
       translucent; this garland's solid, saturated hearts didn't, and
       per the user, after seeing it live: "the white text on the pink
       background are difficult to read, especially with the heart
       banner behind it." Moved to its own small banner over the
       content panel instead (theme-valentines-garland.svg,
       base.html's own `[data-theme="valentines"] main` rule) rather
       than removed outright - that spot has no text sitting in front of
       it to conflict with.

       Portrait, not landscape - same `cover`-crops-a-narrow-sidebar
       reasoning every other seasonal scene's own top comment explains:
       the tree given a soft halo behind it rather than a near-black
       silhouette; the mailbox given real, specific shape (a rounded
       body, a post, a flag, peeking envelope corners) rather than a
       plain blob, learned from Thanksgiving's own hay-bale/pumpkin fix
       rather than needing a second pass to find it here too. -->
  <defs>
    <linearGradient id="vsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f3"/>
      <stop offset="45%" stop-color="#f0a0b8"/>
      <stop offset="100%" stop-color="#6e1f3a"/>
    </linearGradient>
    <radialGradient id="vtreehalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9e3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd9e3" stop-opacity="0"/>
    </radialGradient>
    <path id="heart" d="M0,8 C-5,0 -14,-2 -14,-9 C-14,-15 -9,-18 -4,-15 C-2,-14 0,-11 0,-9 C0,-11 2,-14 4,-15 C9,-18 14,-15 14,-9 C14,-2 5,0 0,8 Z"/>
    <g id="envelope">
      <rect x="-13" y="-9" width="26" height="18" rx="1.5" fill="#fdf7f8" stroke="#c0392b" stroke-width="1.3"/>
      <path d="M-13,-9 L0,2 L13,-9" fill="none" stroke="#c0392b" stroke-width="1.3"/>
      <use href="#heart" transform="translate(0,2) scale(0.22)" fill="#e85d8a"/>
    </g>
  </defs>
  <rect width="300" height="1000" fill="url(#vsky)"/>

  <!-- drifting hearts, scattered through the sky - the same role
       Winter's snowflakes/Halloween's bats play: small, soft, and
       scattered, not part of any one structure -->
  <g fill="#ffd3de" opacity="0.8">
    <use href="#heart" transform="translate(55,150) scale(0.45)"/>
    <use href="#heart" transform="translate(150,190) scale(0.55)"/>
    <use href="#heart" transform="translate(230,165) scale(0.4)"/>
    <use href="#heart" transform="translate(90,235) scale(0.5)"/>
    <use href="#heart" transform="translate(255,250) scale(0.4)"/>
  </g>

  <!-- two small rose bushes flanking the tree - a rounded mound of
       leaves with a few heart blooms, the same flanking-pair slot
       Halloween/Thanksgiving/Winter's own trees use -->
  <g>
    <g transform="translate(38,615)">
      <ellipse cx="0" cy="0" rx="34" ry="26" fill="#3f6b45" stroke="#274a2b" stroke-width="2"/>
      <rect x="-4" y="20" width="8" height="18" fill="#5c3a24"/>
      <use href="#heart" transform="translate(-10,-6) scale(0.4)" fill="#e85d8a" stroke="#a8325a" stroke-width="1"/>
      <use href="#heart" transform="translate(10,-10) scale(0.35)" fill="#c0392b" stroke="#7a1f18" stroke-width="1"/>
      <use href="#heart" transform="translate(2,6) scale(0.38)" fill="#e85d8a" stroke="#a8325a" stroke-width="1"/>
    </g>
    <g transform="translate(264,622) scale(0.9)">
      <ellipse cx="0" cy="0" rx="34" ry="26" fill="#3f6b45" stroke="#274a2b" stroke-width="2"/>
      <rect x="-4" y="20" width="8" height="18" fill="#5c3a24"/>
      <use href="#heart" transform="translate(-10,-6) scale(0.4)" fill="#c0392b" stroke="#7a1f18" stroke-width="1"/>
      <use href="#heart" transform="translate(10,-10) scale(0.35)" fill="#e85d8a" stroke="#a8325a" stroke-width="1"/>
      <use href="#heart" transform="translate(2,6) scale(0.38)" fill="#c0392b" stroke="#7a1f18" stroke-width="1"/>
    </g>
  </g>

  <!-- the heart-blossom tree: a warm halo behind it first (the same
       "warm glow against a cool/saturated sky reads clearly" trick
       theme-winter-cabin.svg's own halo uses), then a trunk and
       branches in bare-branch-line style (like Halloween/Thanksgiving's
       own flanking trees), with clusters of heart "blossoms" at each
       branch tip instead of leaves. -->
  <circle cx="150" cy="430" r="175" fill="url(#vtreehalo)"/>
  <g stroke="#5c3a24" stroke-linecap="round" fill="none">
    <path d="M150,620 L150,520" stroke-width="16"/>
    <path d="M150,520 Q120,480 90,440" stroke-width="7"/>
    <path d="M150,520 Q135,460 130,400" stroke-width="7"/>
    <path d="M150,520 Q160,455 170,395" stroke-width="7"/>
    <path d="M150,520 Q175,475 210,435" stroke-width="7"/>
    <path d="M150,520 Q150,445 150,370" stroke-width="7"/>
  </g>
  <g>
    <use href="#heart" transform="translate(90,440) scale(0.95)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.5"/>
    <use href="#heart" transform="translate(72,450) scale(0.75)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.5"/>
    <use href="#heart" transform="translate(106,448) scale(0.8)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.5"/>

    <use href="#heart" transform="translate(130,400) scale(1)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.5"/>
    <use href="#heart" transform="translate(112,410) scale(0.8)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.5"/>
    <use href="#heart" transform="translate(146,408) scale(0.75)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.5"/>

    <use href="#heart" transform="translate(170,395) scale(1)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.5"/>
    <use href="#heart" transform="translate(152,405) scale(0.75)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.5"/>
    <use href="#heart" transform="translate(188,403) scale(0.8)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.5"/>

    <use href="#heart" transform="translate(210,435) scale(0.95)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.5"/>
    <use href="#heart" transform="translate(228,448) scale(0.75)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.5"/>
    <use href="#heart" transform="translate(196,448) scale(0.8)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.5"/>

    <use href="#heart" transform="translate(150,370) scale(1.05)" fill="#c0392b" stroke="#7a1f18" stroke-width="1.5"/>
    <use href="#heart" transform="translate(130,382) scale(0.8)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.5"/>
    <use href="#heart" transform="translate(170,382) scale(0.8)" fill="#e85d8a" stroke="#a8325a" stroke-width="1.5"/>
  </g>

  <!-- a low picket fence with a heart cutout in each picket - the same
       low-border-element slot Halloween's picket fence/Winter's rail
       fence both occupy -->
  <g stroke="#7a1f18" stroke-width="2">
    <rect x="2" y="620" width="18" height="40" fill="#fdf3f6"/>
    <rect x="38" y="620" width="18" height="40" fill="#fdf3f6"/>
    <rect x="74" y="620" width="18" height="40" fill="#fdf3f6"/>
    <rect x="110" y="620" width="18" height="40" fill="#fdf3f6"/>
    <rect x="146" y="620" width="18" height="40" fill="#fdf3f6"/>
    <rect x="182" y="620" width="18" height="40" fill="#fdf3f6"/>
    <rect x="218" y="620" width="18" height="40" fill="#fdf3f6"/>
    <rect x="254" y="620" width="18" height="40" fill="#fdf3f6"/>
    <rect x="280" y="620" width="18" height="40" fill="#fdf3f6"/>
  </g>
  <g stroke="#c0392b" stroke-width="1.3" fill="none">
    <use href="#heart" transform="translate(11,640) scale(0.3)"/>
    <use href="#heart" transform="translate(47,640) scale(0.3)"/>
    <use href="#heart" transform="translate(83,640) scale(0.3)"/>
    <use href="#heart" transform="translate(119,640) scale(0.3)"/>
    <use href="#heart" transform="translate(155,640) scale(0.3)"/>
    <use href="#heart" transform="translate(191,640) scale(0.3)"/>
    <use href="#heart" transform="translate(227,640) scale(0.3)"/>
    <use href="#heart" transform="translate(263,640) scale(0.3)"/>
    <use href="#heart" transform="translate(289,640) scale(0.3)"/>
  </g>
  <g stroke="#7a1f18" stroke-width="3">
    <line x1="0" y1="630" x2="300" y2="630"/>
    <line x1="0" y1="652" x2="300" y2="652"/>
  </g>

  <!-- the ground - a blush path color, distinct from the fence/sky -->
  <rect x="0" y="660" width="300" height="340" fill="#f6dde4"/>

  <!-- the valentine mailbox - standing in the foreground, the same
       bottom-of-the-scene focal role Winter's frozen pond/skaters play.
       A real, specific shape (rounded body, post, base plate, door cap,
       a flag on a rod) plus peeking/scattered envelopes (each with its
       own tiny heart seal), not a plain red blob - learned from
       Thanksgiving's own hay-bale/pumpkin fix rather than needing a
       second pass to find it here too. -->
  <ellipse cx="150" cy="900" rx="34" ry="9" fill="#c98a9c" opacity="0.4"/>
  <rect x="142" y="760" width="16" height="140" fill="#6b5a4a" stroke="#4a3420" stroke-width="2"/>
  <rect x="96" y="758" width="108" height="10" rx="3" fill="#a8291c" stroke="#7a1f18" stroke-width="2"/>
  <rect x="100" y="715" width="100" height="55" rx="27" fill="#c0392b" stroke="#7a1f18" stroke-width="3"/>
  <rect x="178" y="722" width="16" height="40" rx="8" fill="#a8291c" stroke="#7a1f18" stroke-width="2"/>
  <line x1="108" y1="725" x2="92" y2="695" stroke="#4a3420" stroke-width="3" stroke-linecap="round"/>
  <rect x="82" y="686" width="14" height="14" fill="#e85d8a" stroke="#7a1f18" stroke-width="1.5"/>

  <use href="#envelope" transform="translate(128,707) rotate(-14) scale(0.9)"/>
  <use href="#envelope" transform="translate(150,701) scale(0.95)"/>
  <use href="#envelope" transform="translate(172,708) rotate(13) scale(0.9)"/>

  <use href="#envelope" transform="translate(95,845) rotate(-20)"/>
  <use href="#envelope" transform="translate(212,862) rotate(18) scale(1.1)"/>
  <use href="#heart" transform="translate(60,900) scale(0.3)" fill="#e85d8a" stroke="#a8325a" stroke-width="1"/>
  <use href="#heart" transform="translate(245,915) scale(0.35)" fill="#c0392b" stroke="#7a1f18" stroke-width="1"/>

  <!-- a drift of fallen heart-petals along the very bottom edge, the
       same role Winter's own snowdrift plays -->
  <path d="M0,1000 L0,950 Q60,940 120,952 Q180,938 240,950 Q280,944 300,952 L300,1000 Z" fill="#e85d8a" opacity="0.3"/>
</svg>
