<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1000" width="300" height="1000">
  <!-- Winter theme's sidebar scene (see themes.py/base.html) - a cozy
       snowy-dusk scene: a pale winter moon, snow-capped evergreens, a
       log cabin with glowing windows and a smoking chimney, drifting
       snowflakes. Deliberately generic winter/snow, not Christmas,
       Hanukkah, or any other specific holiday - the same
       "school-appropriate for everyone" bar Halloween's ghosts-not-
       religion and Thanksgiving's harvest-not-Pilgrims choices already
       follow.

       Portrait, not landscape - same `cover`-crops-a-narrow-sidebar
       reason theme-halloween-manor.svg's own top comment explains, and
       every lesson both earlier seasonal scenes needed a second pass to
       learn, applied from the start instead: the moon kept small and
       tucked into a top corner clear of the header's own nav column
       rendered on top of this image; the cabin given a halo behind it
       plus a lighter fill/outline than the sky immediately behind it,
       not a near-black silhouette; every window kept clear of every
       roofline and wall corner; every ground-level decoration (the
       bushes below) given real, specific shape language rather than a
       plain circle - see Thanksgiving's own hay-bale/pumpkin fix for
       what that mistake actually looked like. -->
  <defs>
    <linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dce8f0"/>
      <stop offset="45%" stop-color="#6f95bd"/>
      <stop offset="100%" stop-color="#22355a"/>
    </linearGradient>
    <radialGradient id="wmoonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eef6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#eef6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wcabinhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wwindowglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="1000" fill="url(#wsky)"/>

  <!-- pale winter moon, small and tucked into the top corner -->
  <circle cx="225" cy="60" r="78" fill="url(#wmoonglow)"/>
  <circle cx="225" cy="60" r="32" fill="#f7fbff"/>
  <circle cx="213" cy="48" r="5" fill="#dce8f2" opacity="0.7"/>
  <circle cx="235" cy="70" r="3.5" fill="#dce8f2" opacity="0.7"/>

  <!-- drifting snowflakes, scattered through the sky - simple 6-point
       asterisks, unmistakably snowflakes rather than generic stars -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <g transform="translate(55,90)"><path d="M0,-7 L0,7 M-6,-3.5 L6,3.5 M-6,3.5 L6,-3.5"/></g>
    <g transform="translate(150,50) scale(0.7)"><path d="M0,-7 L0,7 M-6,-3.5 L6,3.5 M-6,3.5 L6,-3.5"/></g>
    <g transform="translate(30,180) scale(0.6)"><path d="M0,-7 L0,7 M-6,-3.5 L6,3.5 M-6,3.5 L6,-3.5"/></g>
    <g transform="translate(265,160) scale(0.8)"><path d="M0,-7 L0,7 M-6,-3.5 L6,3.5 M-6,3.5 L6,-3.5"/></g>
    <g transform="translate(190,210) scale(0.55)"><path d="M0,-7 L0,7 M-6,-3.5 L6,3.5 M-6,3.5 L6,-3.5"/></g>
  </g>

  <!-- a pair of snow-capped evergreens flanking the cabin - solid fir
       silhouettes (three stacked tiers), not bare branch lines like
       Halloween/Thanksgiving's own flanking trees, with a white
       snow-dusting along each tier's upper edge -->
  <g>
    <g transform="translate(30,540)">
      <polygon points="0,-140 -26,-96 26,-96" fill="#2e5b3f" stroke="#1c3d28" stroke-width="2"/>
      <polygon points="0,-100 -30,-52 30,-52" fill="#316246" stroke="#1c3d28" stroke-width="2"/>
      <polygon points="0,-56 -34,0 34,0" fill="#356b4c" stroke="#1c3d28" stroke-width="2"/>
      <rect x="-6" y="0" width="12" height="16" fill="#4a3624"/>
      <path d="M-24,-135 Q0,-128 24,-135 L18,-122 Q0,-129 -18,-122 Z" fill="#f5faff" opacity="0.9"/>
      <path d="M-28,-95 Q0,-86 28,-95 L22,-80 Q0,-89 -22,-80 Z" fill="#f5faff" opacity="0.9"/>
      <path d="M-32,-50 Q0,-40 32,-50 L25,-34 Q0,-44 -25,-34 Z" fill="#f5faff" opacity="0.9"/>
    </g>
    <g transform="translate(270,555) scale(0.85)">
      <polygon points="0,-140 -26,-96 26,-96" fill="#2e5b3f" stroke="#1c3d28" stroke-width="2"/>
      <polygon points="0,-100 -30,-52 30,-52" fill="#316246" stroke="#1c3d28" stroke-width="2"/>
      <polygon points="0,-56 -34,0 34,0" fill="#356b4c" stroke="#1c3d28" stroke-width="2"/>
      <rect x="-6" y="0" width="12" height="16" fill="#4a3624"/>
      <path d="M-24,-135 Q0,-128 24,-135 L18,-122 Q0,-129 -18,-122 Z" fill="#f5faff" opacity="0.9"/>
      <path d="M-28,-95 Q0,-86 28,-95 L22,-80 Q0,-89 -22,-80 Z" fill="#f5faff" opacity="0.9"/>
      <path d="M-32,-50 Q0,-40 32,-50 L25,-34 Q0,-44 -25,-34 Z" fill="#f5faff" opacity="0.9"/>
    </g>
  </g>

  <!-- the cabin: a warm halo behind it first (a warm glow against a
       cool sky reads clearly by both lightness and hue, a more robust
       version of the lighter-fill trick theme-halloween-manor.svg and
       theme-thanksgiving-harvest.svg both rely on for their own
       structures), then warm log-cabin browns for every wall/roof
       shape, outlined for edge definition. -->
  <circle cx="150" cy="490" r="185" fill="url(#wcabinhalo)"/>
  <g stroke="#4a3420" stroke-width="2.5">
    <!-- main cabin body -->
    <rect x="75" y="440" width="150" height="140" fill="#8a5a34"/>
    <!-- log courses - a few horizontal lines suggesting stacked logs -->
    <g stroke="#6b4526" stroke-width="1.3" opacity="0.6">
      <line x1="76" y1="462" x2="224" y2="462"/>
      <line x1="76" y1="486" x2="224" y2="486"/>
      <line x1="76" y1="510" x2="224" y2="510"/>
      <line x1="76" y1="534" x2="224" y2="534"/>
      <line x1="76" y1="558" x2="224" y2="558"/>
    </g>
    <!-- roof: a simple gable -->
    <polygon points="55,440 150,375 245,440" fill="#5c3f24" stroke-linejoin="round"/>
    <!-- chimney -->
    <rect x="185" y="390" width="22" height="45" fill="#6b6b6b"/>
  </g>
  <!-- snow on the roof - a lighter band following the roof's own
       silhouette near its ridge, tapering toward the eaves, so the roof
       reads as "snow-capped" rather than needing a caption -->
  <path d="M150,375 L245,440 L232,440 L150,388 L68,440 L55,440 Z" fill="#f0f6fb" opacity="0.92"/>
  <!-- a wisp of chimney smoke, drifting -->
  <path d="M196,388 Q188,372 198,358 Q206,346 198,332" stroke="#e6ecf2" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- a round loft window, glowing warmly -->
  <circle cx="150" cy="410" r="15" fill="url(#wwindowglow)"/>
  <circle cx="150" cy="410" r="9" fill="#ffdb8a"/>
  <line x1="150" y1="402" x2="150" y2="418" stroke="#4a3420" stroke-width="1.5"/>
  <line x1="142" y1="410" x2="158" y2="410" stroke="#4a3420" stroke-width="1.5"/>

  <!-- two main-body windows -->
  <rect x="98" y="480" width="24" height="32" rx="2" fill="url(#wwindowglow)"/>
  <rect x="103" y="486" width="14" height="20" fill="#ffdb8a"/>
  <rect x="178" y="480" width="24" height="32" rx="2" fill="url(#wwindowglow)"/>
  <rect x="183" y="486" width="14" height="20" fill="#ffdb8a"/>

  <!-- a plain plank front door -->
  <rect x="133" y="535" width="34" height="45" fill="#4a3420" stroke="#2e2013" stroke-width="2"/>
  <circle cx="160" cy="558" r="2" fill="#ffdb8a"/>

  <!-- a low rail fence, snow-dusted along the top rail -->
  <g stroke="#4a3420" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="640" x2="300" y2="640"/>
    <line x1="0" y1="654" x2="300" y2="654"/>
    <line x1="20" y1="620" x2="20" y2="658"/>
    <line x1="70" y1="620" x2="70" y2="658"/>
    <line x1="230" y1="620" x2="230" y2="658"/>
    <line x1="280" y1="620" x2="280" y2="658"/>
  </g>
  <g fill="#f5faff" opacity="0.9">
    <ellipse cx="20" cy="618" rx="6" ry="3"/>
    <ellipse cx="70" cy="618" rx="6" ry="3"/>
    <ellipse cx="230" cy="618" rx="6" ry="3"/>
    <ellipse cx="280" cy="618" rx="6" ry="3"/>
    <rect x="0" y="637" width="300" height="4" opacity="0.7"/>
  </g>

  <!-- snow-covered ground -->
  <rect x="0" y="658" width="300" height="342" fill="#eaf2f8"/>

  <!-- a couple of snow-dusted shrubs - a bumpy, scalloped green
       silhouette (three overlapping mounds, not one plain circle) with
       a white snow-cap over the top half, the same specific shape
       language Thanksgiving's own hay-bale/pumpkin fix established: a
       plain circle alone doesn't read as anything in particular at this
       scale, it needs its own real defining detail. -->
  <g>
    <g transform="translate(55,725)">
      <path d="M-30,10 Q-34,-14 -14,-16 Q-10,-30 8,-24 Q24,-30 30,-12 Q40,-8 34,10 Z" fill="#2e5b3f" stroke="#1c3d28" stroke-width="2"/>
      <path d="M-26,-4 Q-10,-20 8,-18 Q22,-22 28,-8 Q10,-14 -8,-10 Q-18,-8 -26,-4 Z" fill="#f5faff" opacity="0.9"/>
    </g>
    <g transform="translate(240,735) scale(0.8)">
      <path d="M-30,10 Q-34,-14 -14,-16 Q-10,-30 8,-24 Q24,-30 30,-12 Q40,-8 34,10 Z" fill="#2e5b3f" stroke="#1c3d28" stroke-width="2"/>
      <path d="M-26,-4 Q-10,-20 8,-18 Q22,-22 28,-8 Q10,-14 -8,-10 Q-18,-8 -26,-4 Z" fill="#f5faff" opacity="0.9"/>
    </g>
  </g>

  <!-- a low snowdrift along the very bottom, an irregular mound (not a
       circle either) so the ground doesn't just end abruptly -->
  <path d="M0,1000 L0,760 Q60,745 120,758 Q180,742 240,756 Q280,748 300,758 L300,1000 Z" fill="#f5faff" opacity="0.5"/>
</svg>
