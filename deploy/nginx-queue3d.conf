# Reverse proxy for queue3d - the app itself only listens on 127.0.0.1:8000
# (see queue3d.service) once this is in place, so this is the only thing
# actually reachable from the rest of the deployment network. Two reasons
# for this shape, not just one: users on a plain http://<host>/ address
# with no port number to remember (this app serves many non-technical
# users, per its own README - every extra thing to type/remember is real
# friction there), and the app itself never needs to be directly exposed
# at all, which is a real defense-in-depth improvement on its own even
# setting the port-number convenience aside.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Generous, not unbounded - comfortably above any single upload this
    # app's own limits could ever produce (MAX_UPLOAD_BYTES=50MB per file,
    # MAX_ZIP_MODEL_FILES=25 per zip - see app/storage.py), so nginx never
    # rejects something the app itself would have accepted, while still
    # being a real, finite cap rather than none at all.
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matches this app's own real request shape - a large multi-model
        # zip upload, or a slow slicing status poll, not just quick page
        # loads - rather than nginx's fairly short proxy defaults.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
