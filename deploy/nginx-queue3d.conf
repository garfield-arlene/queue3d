# Reverse proxy for queue3d - the app itself only listens on 127.0.0.1:8000
# (see queue3d.service) once this is in place, so this is the only thing
# actually reachable from the rest of the deployment network. Terminates
# TLS here too, with a real Let's Encrypt certificate for
# q3d.home.mygarfield.us (see deploy/README.md's "TLS certificate"
# section) - not self-signed. Managed Chromebooks on the actual
# deployment network turned out to hard-block a self-signed cert outright
# (no "proceed anyway" option at all - a real district device-policy
# behavior, not a hypothetical), which a self-signed cert can never
# satisfy regardless of how it's generated; a real cert from a
# publicly-trusted CA is the only thing that does. The cert itself is
# issued elsewhere (this deployment has no internet access, by design, so
# it could never run its own ACME client) and transferred in - see
# remote_install.sh.
#
# This still depends on q3d.home.mygarfield.us actually resolving to this
# Pi's LAN IP *on the deployment network itself* - the cert alone doesn't
# achieve that, only makes the connection trusted once a client already
# reached it. See deploy/README.md for the DNS side of this.
#
# Plain port 80 just redirects to https - it exists only to catch anyone
# who types a bare http:// URL (or none at all) and send them to the real
# thing, not as a second way to reach the app.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # The exact hostname the transferred certificate is actually issued
    # for (see deploy/README.md) - not "_" the way the self-signed
    # version of this file used, since that version's cert covered
    # whatever hostname anyone asked for (it wasn't really *for* any
    # particular name at all); a real cert has a specific identity to
    # match here. Plain committed source, not a secret - change this
    # (and re-run ./deploy.sh) if the actual hostname/domain ever changes.
    server_name q3d.home.mygarfield.us;

    ssl_certificate     /etc/nginx/ssl/queue3d-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/queue3d-privkey.pem;

    # Generous, not unbounded - comfortably above any single upload this
    # app's own limits could ever produce (MAX_UPLOAD_BYTES=50MB per file,
    # MAX_ZIP_MODEL_FILES=25 per zip - see app/storage.py), so nginx never
    # rejects something the app itself would have accepted, while still
    # being a real, finite cap rather than none at all.
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matches this app's own real request shape - a large multi-model
        # zip upload, or a slow slicing status poll, not just quick page
        # loads - rather than nginx's fairly short proxy defaults.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
